name: release-artifacts

# Build the real, downloadable release artifacts named by
# release/openstream-1.0.0-gates.tsv. The release workflow only validates a
# staged tree; nothing in CI produced that tree, so staging a release meant
# hand-building on a developer machine. This job removes that step.
#
# It deliberately stops short of signing. Signing needs an Apple Developer ID
# and a Linux signing key that no CI default provides, and a pipeline that
# claimed VERIFIED without them would defeat the fail-closed release checker.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stage
        required: true
        default: 1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Provenance attestation is signed with a short-lived OIDC identity issued
  # to this workflow run; nothing long-lived is stored to produce it.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-package:
    name: Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri and engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/lowlat/target
            desktop/src-tauri/target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build engine release binaries
        working-directory: engine/lowlat
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p openstream-host-agent \
            -p openstream-ffmpeg-host \
            -p openstream-linux-host \
            -p openstream-signal-server

      - name: Build the product shell
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run tauri build -- --bundles deb

      - name: Stage the Linux tarball
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/usr/bin" "$stage/usr/lib/systemd/user" \
            "$stage/usr/share/applications"
          for binary in openstream-host-agent openstream-ffmpeg-host openstream-linux-host openstream-signal-server; do
            install -m 0755 \
              "engine/lowlat/target/x86_64-unknown-linux-gnu/release/$binary" \
              "$stage/usr/bin/$binary"
          done
          install -m 0755 desktop/src-tauri/target/release/openstream-desktop \
            "$stage/usr/bin/openstream-desktop"
          install -m 0644 packaging/linux/openstream-host-agent.service \
            "$stage/usr/lib/systemd/user/openstream-host-agent.service"
          install -m 0644 packaging/linux/openstream.desktop \
            "$stage/usr/share/applications/openstream.desktop"
          mkdir -p out
          tar -czf out/OpenStream-Linux-x86_64.tar.gz -C "$stage" usr
          rm -rf -- "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/OpenStream-Linux-x86_64.tar.gz
          if-no-files-found: error

  macos-package:
    name: macOS arm64 package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the product shell
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run tauri build -- --bundles app,dmg

      - name: Stage the disk image and app archive
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p out
          dmg="$(find "$bundle/dmg" -name '*.dmg' -maxdepth 1 -print -quit)"
          [ -n "$dmg" ] || { echo "no disk image was produced" >&2; exit 1; }
          cp "$dmg" out/OpenStream-macOS-arm64.dmg
          # ditto keeps the symlinks and resource forks that a plain zip drops,
          # which is what makes the archive launchable after extraction.
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle/macos/OpenStream.app" out/OpenStream-macOS-arm64.zip

      - name: Record what the build actually signed with
        run: |
          set -euo pipefail
          app=desktop/src-tauri/target/release/bundle/macos/OpenStream.app
          # Reported, never asserted: an ad-hoc signature is not a release
          # signature, and the signing gate must see the difference.
          codesign -dv --verbose=2 "$app" 2>&1 | tee out/macos-codesign.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            out/OpenStream-macOS-arm64.dmg
            out/OpenStream-macOS-arm64.zip
            out/macos-codesign.txt
          if-no-files-found: error

  stage:
    name: Stage checksums and SBOM
    runs-on: ubuntu-latest
    needs: [linux-package, macos-package]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: inputs/linux

      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: inputs/macos

      - name: Stage the release tree
        env:
          OPENSTREAM_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
          OPENSTREAM_LINUX_PACKAGE: inputs/linux/OpenStream-Linux-x86_64.tar.gz
          OPENSTREAM_MACOS_PACKAGE: inputs/macos/OpenStream-macOS-arm64.dmg
          OPENSTREAM_MACOS_APP_ARCHIVE: inputs/macos/OpenStream-macOS-arm64.zip
        run: scripts/build-release-artifacts.sh --force

      - name: Attest what built these artifacts
        # Records, against each artifact's digest, which workflow and which
        # commit produced it. This is the provenance half of supply-chain
        # evidence and is independent of signing: it says where a file came
        # from, not who vouches for it, so it is obtainable without any
        # signing identity. Verify with:
        #   gh attestation verify <file> --repo <owner>/<repo>
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/openstream-1.0.0/linux-x86_64/OpenStream-Linux-x86_64.tar.gz
            dist/openstream-1.0.0/macos-aarch64/OpenStream-macOS-arm64.dmg
            dist/openstream-1.0.0/macos-aarch64/OpenStream-macOS-arm64.zip

      - name: Report remaining gates
        run: |
          # Expected to fail: signing and the physical/WAN evidence rows are
          # not something a build job can honestly produce. Printing the
          # checker output here keeps the remaining work visible.
          scripts/check-openstream-1-0-release.sh || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-staging
          path: dist/openstream-1.0.0
          if-no-files-found: error
