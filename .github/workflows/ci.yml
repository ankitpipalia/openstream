name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

# Cancel older runs the moment a new commit supersedes them. Several jobs were
# waiting ten to sixteen minutes purely for a runner while runs for commits
# nobody was looking at any more held them.
#
# This now covers pushes as well as pull requests. A superseded run on `main` is
# a run of a commit the newer head already contains, so cancelling it loses no
# coverage -- during a run of rapid merges it was launching several complete
# 27-job runs whose results nothing would read.
#
# The consequence to remember at release time: the candidate SHA needs a
# COMPLETED run of its own. Freezing a SHA whose run was cancelled by a later
# merge leaves no evidence for it, so freeze first and let that run finish
# before merging anything else.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine/lowlat

jobs:
  # Decides whether this change can skip the native build, sanitizer and target
  # matrices. Deliberately narrow: only Markdown, and only under `docs/` or at
  # the repository root. Anything else -- a workflow, a script, a lockfile, a
  # packaging or deployment file, release evidence, or a Markdown file inside a
  # crate where the ASCII check reads it -- takes the full run.
  #
  # A push is never classified as documentation-only. Those runs are the
  # exact-head evidence for a release candidate and have to be complete.
  classify:
    name: change classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request; running the full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          if [ -z "$changed" ]; then
            echo "no changed files reported; running the full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          # Allow-list, not a deny-list: a path is documentation only if it
          # matches, and anything unrecognised takes the full run. A new kind
          # of file therefore fails safe.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/.+\.md|[^/]+\.md)$'; then
            docs_only=false
          else
            docs_only=true
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Everything that must hold for a documentation change, and therefore must
  # NOT be behind the documentation-only fast path.
  #
  # The acceptance-boundary assertions below read README.md and docs/BUILD.md,
  # which are exactly the files a documentation-only pull request is allowed to
  # change. They lived in `check`, which that fast path skips, so a docs PR
  # could have deleted a required statement, passed its gate and merged, with
  # the failure surfacing later on a push to main.
  #
  # Deliberately not here: the ASCII rule. It is enforced over `engine/lowlat`
  # only (running it repo-wide reports 320 pre-existing violations), and the
  # classifier already routes any Markdown inside a crate to the full run --
  # `engine/lowlat/crates/net/README.md` is one of the cases pinned in
  # `check-ci-classifier.sh`.
  docs-policy:
    name: documentation policy
    runs-on: ubuntu-latest
    # The workflow defaults every `run` to engine/lowlat, where none of these
    # paths exist. Set once for the job rather than per step, so a step added
    # later cannot silently check nothing.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: The classifier's own cases
        run: bash scripts/check-ci-classifier.sh
      - name: MVP acceptance documentation boundary
        run: |
          grep -Fq 'physical Linux-NVIDIA' README.md
          grep -Fq 'X11/FFmpeg/NVENC fallback' README.md
          grep -Fq 'This acceptance does not claim native DRM capture' docs/BUILD.md
          grep -Fq 'decoded-frame zero-copy' docs/BUILD.md

  check:
    name: format, lints, tests
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Install a graphics driver for the conversion test
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libvulkan1 mesa-vulkan-drivers

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/lowlat/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ASCII check
        run: python3 scripts/check-ascii.py

      # The product version lives in eight files. Nothing made them agree until
      # this ran, and they did not: artifacts were named 1.0.0 while every
      # binary inside them reported 1.0.0-dev.
      - name: Product version consistency
        run: |
          bash -n scripts/check-version-consistency.sh
          scripts/check-version-consistency.sh
        # This job defaults to engine/lowlat, where these paths do not exist.
        working-directory: .

      - name: Shell fixture syntax
        run: |
          bash -n engine/lowlat/scripts/netns-fixtures.sh
          bash -n scripts/wan-acceptance.sh scripts/network-fault-matrix.sh
          bash -n scripts/check-openstream-1-0-release.sh scripts/test-openstream-1-0-release.sh
          scripts/test-openstream-1-0-release.sh
        working-directory: .

      - name: Alpine/musl helper syntax
        run: sh -n scripts/alpine-musl-ci.sh

      - name: Local session launcher smoke
        run: |
          bash -n scripts/openstream-local-session.sh scripts/test-openstream-local-session.sh
          bash scripts/test-openstream-local-session.sh
        working-directory: .

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1

      - name: Keystore round trip against a real Secret Service
        # The keystore tests are ignored by default because they write to the
        # developer's own keyring. They are the only thing that exercises a
        # second libsecret call in one process, which is where a dlclosed
        # GObject library aborts re-registration -- a fault that made Linux
        # custody fall back to the file silently, and that no macOS run and no
        # keyring-less runner can reach. So CI provides a keyring and runs
        # them.
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11
          # The daemon prints the environment the client library needs
          # (GNOME_KEYRING_CONTROL and friends) on stdout. Backgrounding it
          # instead of eval-ing that output leaves libsecret talking to a
          # locked keyring, which makes it ask a GUI prompter for a password
          # and fail with "cannot open display" on a runner with no session.
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            cargo test --locked -p openstream-client-core --lib keystore -- --ignored --test-threads=1
          '

      - name: C ABI header syntax
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I include \
            -c crates/host/tests/c/alone.c -o /tmp/openstream-lowlat-abi-c.o
          c++ -std=c++17 -Wall -Wextra -Werror -x c++ -I include \
            -c crates/host/tests/c/alone.c -o /tmp/openstream-lowlat-abi-cpp.o

      - name: Compile fuzz harnesses
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Release artifact manifest
        run: ./scripts/check-release-artifacts.sh
        working-directory: .

  openstream-portable:
    name: OpenStream crates (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux gamepad dependency
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install ffmpeg for VideoToolbox test fixtures (macOS)
        # ffmpeg only *generates* the H.264 clips the native VideoToolbox tests
        # decode; end users never need it. Installing it here lets those tests
        # run instead of silently skipping, and the require-flag step below turns
        # a missing/broken fixture generator into a hard failure.
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      - name: Install toolchain
        run: rustup component add rustfmt
      - name: Format OpenStream additions
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Test portable protocol/service/client crates
        run: cargo test --locked -p openstream-client-core -p openstream-protocol -p openstream-transport -p openstream-signal-server -p openstream-reference-peer -p openstream-media -p openstream-platform -p openstream-windows-media -p openstream-windows-host -p openstream-macos-media -p openstream-client -p openstream-desktop-client -p openstream-ffmpeg-host -p openstream-mobile-ffi -p openstream-bridge -- --test-threads=1
      - name: VideoToolbox hardware decode tests must run, not skip (macOS)
        # OPENSTREAM_REQUIRE_VT_TEST makes a missing/failed ffmpeg fixture a hard
        # error instead of a silent skip, so the native decode coverage cannot
        # quietly vanish from the gate. Re-runs the desktop client with the flag.
        if: matrix.os == 'macos-latest'
        env:
          OPENSTREAM_REQUIRE_VT_TEST: "1"
        # --include-ignored also runs the long-duration soak loopback (fast, ~3s)
        # so that long-session coverage cannot silently rot either.
        run: cargo test --locked -p openstream-desktop-client -- --include-ignored --test-threads=1
      - name: Test native Linux host adapters (X11/PipeWire/HWACCEL parsing)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p openstream-linux-host

  openstream-target-matrix:
    name: OpenStream target (${{ matrix.target }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            host: true
            linux_host: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            host: true
            linux_host: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            host: true
            linux_host: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            host: true
            linux_host: false
          - os: macos-latest
            target: x86_64-apple-darwin
            host: true
            linux_host: false
          - os: macos-latest
            target: aarch64-apple-darwin
            host: true
            linux_host: false
          - os: macos-latest
            target: aarch64-apple-ios
            host: false
            linux_host: false
          - os: ubuntu-latest
            target: aarch64-linux-android
            host: false
            linux_host: false
          - os: ubuntu-latest
            target: x86_64-linux-android
            host: false
            linux_host: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Android SDK tooling
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android'
        uses: android-actions/setup-android@v4.0.1
        with:
          # The action installs "tools platform-tools" by default, and
          # Google has withdrawn "tools" from the repository: sdkmanager
          # reports "Failed to find package 'tools'" and exits non-zero,
          # which failed both Android targets before a line was compiled.
          # The NDK this build actually needs is installed in the next step.
          packages: platform-tools
      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android'
        run: sdkmanager "ndk;26.3.11579264"
      - name: Configure Android NDK compiler
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk_root="$ANDROID_HOME/ndk/26.3.11579264"
          clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          ar="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          ranlib="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$clang"
          test -x "$ar"
          test -x "$ranlib"
          echo "CC_aarch64-linux-android=$clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$ar" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64-linux-android=$ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang" >> "$GITHUB_ENV"
      - name: Configure Android x86_64 NDK compiler
        if: matrix.target == 'x86_64-linux-android'
        run: |
          ndk_root="$ANDROID_HOME/ndk/26.3.11579264"
          clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          ar="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          ranlib="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$clang"
          test -x "$ar"
          test -x "$ranlib"
          echo "CC_x86_64-linux-android=$clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "AR_x86_64-linux-android=$ar" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$ar" >> "$GITHUB_ENV"
          echo "RANLIB_x86_64-linux-android=$ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_x86_64_linux_android=$ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$clang" >> "$GITHUB_ENV"
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Check portable target subset
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: >-
          cargo check --locked --target ${{ matrix.target }}
          -p openstream-protocol
          -p openstream-transport
          -p openstream-media
          -p openstream-platform
          -p openstream-client-core
          -p openstream-mobile-ffi
          -p openstream-host-agent
      # `openstream-ffmpeg-host` and `openstream-linux-host` are not checked
      # separately: the two release builds below compile and link both, for the
      # same target. The portable subset above stays, because those crates are
      # not in any release build here and would otherwise go unbuilt.
      - name: Build OpenStream desktop release artifacts
        if: matrix.host
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p openstream-ffmpeg-host
          -p openstream-client
          -p openstream-signal-server
      - name: Build OpenStream Linux host release artifact
        if: matrix.linux_host
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} -p openstream-linux-host
      - name: Build OpenStream mobile bridge release artifact
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android' || matrix.target == 'aarch64-apple-ios'
        run: cargo build --locked --release --target ${{ matrix.target }} -p openstream-mobile-ffi

  openstream-desktop-target-matrix:
    name: OpenStream desktop client (${{ matrix.target }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native Linux desktop dependency
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      # No `cargo check` first: the release build below compiles the same
      # crate for the same target and links it, which is strictly stronger.
      # Running both cost about 141s of the 361s build on the Windows job.
      - name: Build desktop client release artifact
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} -p openstream-desktop-client

  desktop-shell:
    name: OpenStream desktop product shell
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm's own cache, keyed on the lockfile. Small, bounded, and
          # unrelated to the Cargo target caches that are already close to the
          # repository limit.
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate frontend lockfile
        working-directory: desktop
        run: node -e 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8"))'
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Typecheck and bundle shell
        working-directory: desktop
        run: npm run build
      - name: Run shell tests
        working-directory: desktop
        run: npm test -- --run

  loom:
    name: model checking
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Loom
        run: cargo test -p lowlat-common --lib --release
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  deny:
    name: licenses and advisories
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - name: Deny
        run: cargo deny check
      # The desktop shell is a separate Cargo workspace with its own lockfile,
      # so the engine policy above never reaches it. Without this step the
      # product users actually install is the one component outside dependency
      # policy. Its exceptions are named and explained in its own deny.toml.
      - name: Deny (desktop product shell)
        run: cargo deny --manifest-path desktop/src-tauri/Cargo.toml check
        working-directory: .

  smoke:
    name: protocol and media smoke
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y curl ffmpeg
      - name: Install toolchain
        run: rustup component add rustfmt clippy
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/lowlat/target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
      - name: Full ICE authenticated loopback
        run: timeout 180s ./scripts/full-ice-smoke.sh
        working-directory: .
      - name: FFmpeg encrypted media loopback
        run: >-
          OPENSTREAM_DEMO_SECONDS=3
          OPENSTREAM_DEMO_OUTPUT="$RUNNER_TEMP/openstream-demo.h264"
          timeout 180s ./scripts/run-local-demo.sh
        working-directory: .
      - name: Host-checkable mobile acceptance
        run: ./scripts/mobile-acceptance.sh
        working-directory: .

  sanitizers:
    name: sanitizers
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux gamepad dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libvulkan1 mesa-vulkan-drivers
      - name: Install nightly
        run: rustup toolchain install nightly --component rust-src
      - name: Address sanitizer
        run: |
          cargo +nightly test --workspace --all-features \
            -Z build-std --target x86_64-unknown-linux-gnu \
            -- --test-threads=1
        env:
          RUSTFLAGS: -Z sanitizer=address
          RUSTDOCFLAGS: -Z sanitizer=address

  alpine-musl:
    name: Alpine/musl validation
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Alpine/musl helper executable
        run: |
          cd engine/lowlat
          test -x scripts/alpine-musl-ci.sh
        working-directory: .
      - name: Run pinned Alpine/musl validation
        run: >-
          docker run --rm --platform linux/amd64
          --mount type=bind,src="$PWD",dst=/workspace
          -w /workspace/engine/lowlat
          docker.io/library/rust:1.85.0-alpine3.21@sha256:715f7a1b6b3a538f7b55c0be7db7e5bb0461fe9ea1d0004a481ab0c5d59542ad
          /workspace/engine/lowlat/scripts/alpine-musl-ci.sh
        working-directory: .

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan committed source tree with gitleaks
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$scan_dir"
          docker run --rm --platform linux/amd64 \
            --mount type=bind,src="$scan_dir",dst=/workspace,readonly \
            docker.io/zricethezav/gitleaks:v8.30.1 \
            dir /workspace --redact --no-banner --exit-code 1
        working-directory: .

  desktop-runtime:
    name: OpenStream desktop runtime shell
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup component add rustfmt clippy
        working-directory: .
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The workflow default working directory is engine/lowlat; these paths
      # are relative to the repository root.
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
        working-directory: .
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
        working-directory: .
      - name: Tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
        working-directory: .
    # The Tauri shell is the actual product surface. It was previously absent
    # from CI entirely, so a change that broke it could still go green.

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - classify
      - docs-policy
      - check
      - openstream-portable
      - openstream-target-matrix
      - openstream-desktop-target-matrix
      - desktop-shell
      - desktop-runtime
      - loom
      - deny
      - smoke
      - sanitizers
      - alpine-musl
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_POLICY: ${{ needs.docs-policy.result }}
          CHECK: ${{ needs.check.result }}
          PORTABLE: ${{ needs.openstream-portable.result }}
          TARGETS: ${{ needs.openstream-target-matrix.result }}
          DESKTOP_TARGETS: ${{ needs.openstream-desktop-target-matrix.result }}
          DESKTOP_SHELL: ${{ needs.desktop-shell.result }}
          DESKTOP_RUNTIME: ${{ needs.desktop-runtime.result }}
          LOOM: ${{ needs.loom.result }}
          DENY: ${{ needs.deny.result }}
          SMOKE: ${{ needs.smoke.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          ALPINE_MUSL: ${{ needs.alpine-musl.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          # The classifier decides whether a skip is allowed at all, so it has
          # to have succeeded itself. A classifier that failed or was skipped
          # cannot license anything.
          if [ "$CLASSIFY" != success ]; then
            echo "change classification did not succeed ($CLASSIFY)" >&2
            exit 1
          fi
          # Never skippable, whatever the change was: these are the checks that
          # apply to documentation itself.
          if [ "$DOCS_POLICY" != success ]; then
            echo "documentation policy did not succeed ($DOCS_POLICY)" >&2
            exit 1
          fi
          if [ "$DOCS_ONLY" = true ]; then
            echo "documentation-only change: the build and test matrices were skipped"
          fi
          for result in "$CHECK" "$PORTABLE" "$TARGETS" "$DESKTOP_TARGETS" \
              "$DESKTOP_SHELL" "$DESKTOP_RUNTIME" "$LOOM" "$DENY" "$SMOKE" \
              "$SANITIZERS" "$ALPINE_MUSL" \
              "$SECRET_SCAN"; do
            # A skipped job passes the gate only on a change the classifier
            # proved is documentation only. Everywhere else a skip is a
            # failure, so a job that silently stops running cannot slip past.
            if [ "$result" = skipped ] && [ "$DOCS_ONLY" = true ]; then
              continue
            fi
            if [ "$result" != success ]; then
              echo "CI job result was $result" >&2
              exit 1
            fi
          done
          echo "all CI jobs passed"
        working-directory: .
