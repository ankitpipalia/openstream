[package]
name = "openstream-desktop"
version = "1.0.0-dev"
description = "OpenStream desktop shell"
authors = ["OpenStream contributors"]
edition = "2021"

[lib]
name = "openstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
openstream-app-core = { path = "../../engine/lowlat/crates/app-core" }
openstream-settings = { path = "../../engine/lowlat/crates/settings" }
openstream-host-agent = { path = "../../engine/lowlat/crates/host-agent" }
openstream-local-ipc = { path = "../../engine/lowlat/crates/local-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
