[package]
name = "openstream-desktop"
version = "1.0.0"
description = "OpenStream desktop shell"
authors = ["OpenStream contributors"]
edition = "2021"

[lib]
name = "openstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
openstream-app-core = { path = "../../engine/lowlat/crates/app-core" }
openstream-settings = { path = "../../engine/lowlat/crates/settings" }
