[package]
name = "openstream-windows-media"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["OpenStream contributors"]

[lib]
name = "openstream_windows_media"
path = "src/lib.rs"

# In-process Media Foundation H.264 decode and encode. Raw-ish FFI through
# Microsoft's own `windows` binding (Media Foundation is COM); target-gated so
# no other platform's dependency graph is touched.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
