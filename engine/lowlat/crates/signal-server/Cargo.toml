[package]
name = "openstream-signal-server"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["OpenStream contributors"]

[[bin]]
name = "openstream-signal-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
openstream-protocol = { path = "../protocol" }
openstream-host-ipc = { workspace = true }
lowlat-crypto = { workspace = true }
serde.workspace = true
serde_json.workspace = true
ring.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
webrtc-ice.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
# Already in the dependency graph via axum, so this adds no new supply-chain
# surface. `ServiceExt::oneshot` drives the real router in-process, which
# tests the routes and extractors rather than the handler functions alone.
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
