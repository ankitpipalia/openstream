[package]
name = "openstream-client-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["OpenStream contributors"]

[dependencies]
futures-util.workspace = true
getrandom.workspace = true
hex = "0.4"
if-addrs.workspace = true
libc.workspace = true
openstream-protocol = { path = "../protocol" }
openstream-transport-policy.workspace = true
openstream-transport = { path = "../transport" }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
webpki-roots = "0.26"
url.workspace = true
webrtc-ice.workspace = true
webrtc-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Used only to resolve libsecret at runtime for keystore custody. Nothing is
# linked against it: a machine without libsecret gets a missing backend, not a
# process that will not start.
lowlat-common.workspace = true

[dev-dependencies]
openstream-media = { path = "../media" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "scheduler"
path = "src/scheduler.rs"
