[package]
name = "openstream-macos-host"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["OpenStream contributors"]

[lib]
name = "openstream_macos_host"
path = "src/lib.rs"

# Native macOS host subsystems (currently: screen capture via CoreGraphics).
# Raw framework FFI, target-gated so no other platform's graph is touched.
[target.'cfg(target_os = "macos")'.dependencies]

# The VideoToolbox encoder, used only by the capture_encode_loopback example that
# proves capture -> hardware encode works together with no ffmpeg.
[target.'cfg(target_os = "macos")'.dev-dependencies]
openstream-macos-media = { path = "../macos-media" }

[lints]
workspace = true
